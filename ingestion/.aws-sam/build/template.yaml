AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Timeout: 30
    Environment:
      Variables:
        TABLE_NAME: escape-cville-table
        REGION: us-east-1
Resources:
  IngestFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: C:\Users\seths\vscode\uva\Cloud Computing\escape-cville\ingestion\ingest
      DockerTag: latest
      Dockerfile: Dockerfile
      SamResourceId: IngestFunction
    Properties:
      FunctionName: escape-cville-ingest
      PackageType: Image
      ImageUri: ingestfunction:latest
      Events:
        FrequentSchedule:
          Type: Schedule
          Properties:
            Name: ingest-every-15min-daytime
            Schedule: cron(0/15 10-23 * * ? *)
            Enabled: true
        InfrequentSchedule:
          Type: Schedule
          Properties:
            Name: ingest-every-30min-overnight
            Schedule: cron(0/30 0-9 * * ? *)
            Enabled: true
      Policies:
      - DynamoDBWritePolicy:
          TableName: escape-cville-table
      - DynamoDBReadPolicy:
          TableName: escape-cville-table
      - Statement:
        - Effect: Allow
          Action:
          - ssm:GetParameter
          Resource: arn:aws:ssm:us-east-1:045511193184:parameter/escape-cville/here-api-key
        - Effect: Allow
          Action:
          - kms:Decrypt
          Resource: '*'
